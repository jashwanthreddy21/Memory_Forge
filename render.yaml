services:
  # Python FastAPI Backend Deployment on Render
  - type: web
    name: memory-forge-backend-python
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_API_URL
        value: https://api.hindsight.vectorize.io
      - key: GEMINI_API_KEY
        sync: false

  # (Alternative) Node.js / Express Backend Deployment on Render
  - type: web
    name: memory-forge-backend-node
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_API_URL
        value: https://api.hindsight.vectorize.io
      - key: GEMINI_API_KEY
        sync: false
